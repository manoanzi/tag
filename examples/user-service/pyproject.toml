[project]
name = "tag-user-service-example"
version = "0.1.0"
description = "Runnable TAG (The Architecture of Gateways) example: a user service with FastAPI and SQLite."
requires-python = ">=3.11"
dependencies = [
    "returns>=0.22",
    "pydantic[email]>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
